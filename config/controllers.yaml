controller_manager:
  ros__parameters:
    update_rate: 250  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    left_arm_motion_controller:
      type: cartesian_motion_controller/CartesianMotionController
    left_arm_handle:
      type: cartesian_controller_handles/MotionControlHandle
    right_arm_motion_controller:
      type: cartesian_motion_controller/CartesianMotionController
    right_arm_handle:
      type: cartesian_controller_handles/MotionControlHandle

left_arm_motion_controller:
  ros__parameters:
    robot_base_link: "torso_link"
    end_effector_link: "left_rubber_hand"
    joints:
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_joint
      - left_wrist_roll_joint
      - left_wrist_pitch_joint
      - left_wrist_yaw_joint
    command_interfaces:
      - position
    solver:
      error_scale: 0.5
      iterations: 10
      publish_state_feedback: True
    pd_gains:
      trans_x: {p: 1.0}
      trans_y: {p: 1.0}
      trans_z: {p: 1.0}
      rot_x: {p: 0.5}
      rot_y: {p: 0.5}
      rot_z: {p: 0.5}

left_arm_handle:
  ros__parameters:
    robot_base_link: "torso_link"
    end_effector_link: "left_rubber_hand"
    joints:
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_joint
      - left_wrist_roll_joint
      - left_wrist_pitch_joint
      - left_wrist_yaw_joint

right_arm_motion_controller:
  ros__parameters:
    robot_base_link: "torso_link"
    end_effector_link: "right_rubber_hand"
    joints:
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_joint
      - right_wrist_roll_joint
      - right_wrist_pitch_joint
      - right_wrist_yaw_joint
    command_interfaces:
      - position
    solver:
      error_scale: 0.5
      iterations: 10
      publish_state_feedback: True
    pd_gains:
      trans_x: {p: 1.0}
      trans_y: {p: 1.0}
      trans_z: {p: 1.0}
      rot_x: {p: 0.5}
      rot_y: {p: 0.5}
      rot_z: {p: 0.5}

right_arm_handle:
  ros__parameters:
    robot_base_link: "torso_link"
    end_effector_link: "right_rubber_hand"
    joints:
